name: Cross-Platform Release (Android + Windows + Web)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Verify version.json and tag alignment
        id: meta
        shell: bash
        run: |
          node scripts/sync-version.mjs --check
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            node scripts/sync-version.mjs --verify-tag "${GITHUB_REF_NAME}"
          fi
          VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('version.json','utf8')).version)")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Typecheck and run automated tests
        run: |
          npm run lint
          npm test

      - name: Build portable Web distribution archive
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          VITE_TARGET=web VITE_BASE_PATH="./" npm run build
          mkdir -p release-web
          (cd dist && zip -r "../release-web/World-of-Adventure-Mod-Creator-v${VERSION}-Web.zip" .)

      - name: Upload Web archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release-web/*.zip
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Validate required Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "ERROR: Required GitHub Secret $var is missing or empty."
              exit 1
            fi
          done

      - name: Build Capacitor web bundle and sync Android
        run: npm run android:sync

      - name: Decode keystore, assemble signed APK, and verify with apksigner
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          KEYSTORE_FILE="${RUNNER_TEMP}/woa-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > "${KEYSTORE_FILE}"
          if [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "ERROR: Decoded keystore file is empty."
            exit 1
          fi

          chmod +x android/gradlew
          export ANDROID_KEYSTORE_PATH="${KEYSTORE_FILE}"
          pushd android >/dev/null
          ./gradlew assembleRelease --no-daemon
          popd >/dev/null

          SOURCE_APK="$(find android/app/build/outputs/apk/release -name '*release*.apk' | head -n 1)"
          if [ -z "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "${APKSIGNER}" verify --verbose --print-certs "${SOURCE_APK}"

          mkdir -p release-android
          cp "${SOURCE_APK}" "release-android/World-of-Adventure-Mod-Creator-v${VERSION}.apk"

      - name: Clean up decoded keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/woa-release.jks"

      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-android/*.apk
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Package Windows Portable and Setup EXEs
        run: npm run pack:windows

      - name: Verify generated Windows executables
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $portable = "release-windows/World-of-Adventure-Mod-Creator-v$version-Windows-Portable.exe"
          $setup = "release-windows/World-of-Adventure-Mod-Creator-v$version-Windows-Setup.exe"
          foreach ($file in @($portable, $setup)) {
            if (-not (Test-Path $file) -or ((Get-Item $file).Length -le 0)) {
              Write-Error "Missing or empty Windows build artifact: $file"
              exit 1
            }
          }

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release-windows/*-Windows-Portable.exe
            release-windows/*-Windows-Setup.exe
          if-no-files-found: error

  publish:
    needs: [prepare, android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: List assembled release artifacts
        run: ls -lh dist-release

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: World of Adventure Mod Creator v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            dist-release/World-of-Adventure-Mod-Creator-v${{ needs.prepare.outputs.version }}.apk
            dist-release/World-of-Adventure-Mod-Creator-v${{ needs.prepare.outputs.version }}-Windows-Portable.exe
            dist-release/World-of-Adventure-Mod-Creator-v${{ needs.prepare.outputs.version }}-Windows-Setup.exe
            dist-release/World-of-Adventure-Mod-Creator-v${{ needs.prepare.outputs.version }}-Web.zip
